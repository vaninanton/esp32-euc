; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = ESP32-EUC
description = "EUC Lights module based on ESP32"
default_envs = esp32

[flags]
monitor_filters_debug =
    esp32_exception_decoder
    ; default
    ; log2file
    ; direct
    colorize
    ; debug

[env]
platform = espressif32@^6.10.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.3
    fastled/FastLED@^3.9.16

[esp32_base]
monitor_speed = 115200
upload_speed = 460800

[env:esp32]
extends = esp32_base
board = esp32dev
build_flags =
    -DLED_DATA_PIN=13
    -DLEDS_COUNT=17

[env:esp32_debug]
extends = env:esp32
monitor_filters =
    ${flags.monitor_filters_debug}
build_type = debug
build_flags =
    -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
    -DCORE_DEBUG_LEVEL=5
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2

[env:esp32mini]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags =
    -DLED_DATA_PIN=4
    -DLEDS_COUNT=17

[env:esp32mini_debug]
extends = env:esp32mini
monitor_filters =
    ${flags.monitor_filters_debug}
build_type = debug
build_flags =
    -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
    -DCORE_DEBUG_LEVEL=5
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
